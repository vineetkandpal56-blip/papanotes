let currentQuestion = 0;

let score = 0;

let selectedAnswer = null;

/* LOAD QUESTION */

function loadQuestion(){

document.getElementById("progress")
.innerHTML =

"Question "
+ (currentQuestion + 1)
+ " / "
+ quiz.length;

document.getElementById("question")
.innerHTML =
quiz[currentQuestion].question;

/* OPTIONS */

for(let i=0;i<4;i++){

let btn =
document.getElementById("opt"+i);

btn.innerHTML =
quiz[currentQuestion].options[i];

btn.classList.remove("selected");

}

/* SHOW OLD SELECTED */

if(userAnswers[currentQuestion]
!== undefined){

document.getElementById(
"opt" +
userAnswers[currentQuestion]

).classList.add("selected");

}

}

/* SAVE ANSWERS */

let userAnswers = [];

/* SELECT OPTION */

function selectAnswer(index){

selectedAnswer = index;

/* SAVE */

userAnswers[currentQuestion]
= index;

/* REMOVE OLD */

for(let i=0;i<4;i++){

document.getElementById("opt"+i)
.classList.remove("selected");

}

/* ADD NEW */

document.getElementById("opt"+index)
.classList.add("selected");

}

/* NEXT QUESTION */

function nextQuestion(){

if(selectedAnswer === null){

alert("⚠ Please select an answer!");

return;

}

/* NEXT */

currentQuestion++;

selectedAnswer = null;

if(currentQuestion >= quiz.length){

showResult();

}

else{

loadQuestion();

}

}

/* PREVIOUS */

function prevQuestion(){

if(currentQuestion > 0){

currentQuestion--;

selectedAnswer =
userAnswers[currentQuestion];

loadQuestion();

}

}

/* SHOW RESULT */

function showResult(){

score = 0;

/* COUNT SCORE */

for(let i=0;i<quiz.length;i++){

if(userAnswers[i] ===
quiz[i].answer){

score++;

}

}

let iqText = "";

/* IQ LEVEL */

if(score >= 98){

iqText =
"🧠 Your IQ Level is Genius";

}

else if(score >= 70){

iqText =
"🔥 Your IQ Level is High";

}
else if(score >= 70){

iqText =
"🔥 Your IQ Level is High";

}
else if(score >= 35){

iqText =
"😎 Your IQ Level is Average";

}

else{

iqText =
"💀 Your IQ Level Needs Improvement";

}
