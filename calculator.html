<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>PapaNotes Calculator</title>
<img src="logopapanotes.png"
class="logo">

<style>
    .logo{

position:absolute;

top:20px;
left:20px;

width:90px;

height:auto;

z-index:100;

filter:
drop-shadow(
0 0 15px
rgba(123,97,255,0.8)
);

animation:logoFloat 3s ease-in-out infinite;

}

/* FLOAT */

@keyframes logoFloat{

0%{

transform:translateY(0);

}

50%{

transform:translateY(-8px);

}

100%{

transform:translateY(0);

}

}

body{

margin:0;
padding:0;

font-family:Arial,sans-serif;

min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:linear-gradient(
135deg,
#111827,
#1f2937
);

}

.calculator{

width:320px;

padding:25px;

border-radius:24px;

background:rgba(255,255,255,0.08);

backdrop-filter:blur(12px);

box-shadow:
0 0 30px rgba(123,97,255,0.3);

}

.title{

text-align:center;

font-size:32px;

font-weight:bold;

margin-bottom:20px;

background:linear-gradient(
90deg,
#7b61ff,
#00e5ff
);

-webkit-background-clip:text;
background-clip:text;


-webkit-text-fill-color:transparent;

}

#display{

width:100%;

height:70px;

border:none;

outline:none;

border-radius:16px;

margin-bottom:20px;

font-size:30px;

padding-left:15px;

background:#374151;

color:white;

}

.buttons{

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:12px;

}

button{

height:65px;

border:none;

border-radius:16px;

font-size:22px;

font-weight:bold;

cursor:pointer;

background:#374151;

color:white;

transition:0.3s;

}

button:hover{

background:#7b61ff;

transform:scale(1.05);

}

.equal{

grid-column:span 2;

background:linear-gradient(
135deg,
#7b61ff,
#00e5ff
);

}

</style>

</head>

<body>

<div class="calculator">

<div class="title">

🧮 Calculator

</div>

<input type="text"
id="display"
readonly>

<div class="buttons">

<button onclick="clearDisplay()">
C
</button>

<button onclick="append('%')">
%
</button>

<button onclick="append('/')">
÷
</button>

<button onclick="append('*')">
×
</button>

<button onclick="append('7')">
7
</button>

<button onclick="append('8')">
8
</button>

<button onclick="append('9')">
9
</button>

<button onclick="append('-')">
-
</button>

<button onclick="append('4')">
4
</button>

<button onclick="append('5')">
5
</button>

<button onclick="append('6')">
6
</button>

<button onclick="append('+')">
+
</button>

<button onclick="append('1')">
1
</button>

<button onclick="append('2')">
2
</button>

<button onclick="append('3')">
3
</button>

<button onclick="deleteLast()">
⌫
</button>

<button onclick="append('0')">
0
</button>

<button onclick="append('.')">
.
</button>

<button class="equal"
onclick="calculate()">

=

</button>

</div>

</div>

<script>

let display =
document.getElementById("display");

function append(value){

display.value += value;

}

function clearDisplay(){

display.value = "";

}

function deleteLast(){

display.value =
display.value.slice(0,-1);

}

function calculate(){

try{

display.value =
eval(display.value);

}

catch{

display.value = "Error";

}

}

</script>

</body>

</html>
